name: Проверки учебных витрин
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Восстановить локальное окружение
        run: |
          python -m pip install uv==0.13.1
          uv sync --frozen --no-dev
      - name: Проверить мастерскую и упаковку
        run: uv run --frozen python -m unittest discover -s checks -v
      - name: Проверить настоящий dbt и восстановление
        run: uv run --frozen python scripts/smoke.py
      - name: Собрать исходный архив
        run: uv run --frozen python scripts/package_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dbt-order-marts-${{ matrix.os }}
          path: artifacts/
